map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openquiz_api {
    server api:8080;
}

server {
    listen 8080;
    # The image's entrypoint normally appends this line itself, but it cannot
    # write to a read-only /etc, and without it "localhost" (which resolves to
    # ::1 first) is refused.
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Version banners tell a scanner which CVEs to try first.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://openquiz_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /hubs/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://openquiz_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        # index.html carries the hashed asset names, so a cached copy points the
        # browser at files that a redeploy has already removed.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
}
