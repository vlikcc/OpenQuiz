# Response headers every route gets. nginx drops inherited add_header
# directives from any block that declares its own, so this file is included in
# each location that adds headers of its own rather than set once at the top.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The API and the SignalR hub are proxied under this same origin, so 'self'
# covers them. Serving the API from another origin means adding it to
# connect-src; see docs/SELF_HOSTING.md.
#
# Google Sign-In loads its script and renders its button in an iframe, both
# from accounts.google.com. Dropping the provider means dropping those two
# entries. 'unsafe-inline' for styles covers the splash screen block in
# index.html and the inline styles React writes for the charts.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob:" always;
