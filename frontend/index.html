<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Open Quiz - Etkileşimli yarışma, anket ve quiz platformu" />
  <meta name="theme-color" content="#4F46E5" />

  <title>Open Quiz</title>

  <!-- Loading screen için kritik CSS - JS yüklenmeden önce göster -->
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- Anında görünen loading ekranı -->
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-text">Open Quiz</div>
    </div>
  </div>

  <div id="root"></div>

  <!-- main.jsx removes #initial-loader once React has painted. -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
